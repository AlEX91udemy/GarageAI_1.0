steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - agents_service/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/garageai/garageai-agents:location-eu-20261120
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/garageai/garageai-agents:location-eu-20261120
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/garageai/garageai-agents:location-eu-20261120
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: europe-west1
